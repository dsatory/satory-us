<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dominik Satory</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🙃</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
.name, .title, .contact, #top-right a {
  text-shadow: 0 2px 10px rgba(0,0,0,0.75), 0 1px 4px rgba(0,0,0,0.5);
}
body {
  min-height: 100vh;
  background: url('./bg.jpg') center/cover no-repeat;
  font-family: 'Helvetica Neue', Helvetica, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  z-index: 0;
}
#top-right {
  position: fixed;
  top: 24px;
  right: 32px;
  z-index: 10;
}
#top-right a {
  color: rgba(255,255,255,0.5);
  text-decoration: none;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0;
  transition: color 0.2s;
}
#top-right a:hover { color: rgba(255,255,255,0.9); }
#card {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  color: rgba(255,255,255,0.9);
}
#card .name {
  font-size: 28.2px;
  font-weight: 600;
  letter-spacing: 0;
  margin-bottom: 6px;
}
#card .title {
  font-size: 15px;
  font-weight: 400;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0.25px;
  margin-bottom: 8px;
}
#card .contact {
  font-size: 15px;
  color: rgba(255,255,255,0.75);
  letter-spacing: 0;
}
#card .contact a {
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  transition: color 0.2s;
}
#card .contact a:hover { color: rgba(255,255,255,0.9); }
#card .sep { margin: 0 1px; }
</style>
</head>
<body>
  <div id="top-right"><a href="https://home.satory.us">Sign in</a></div>
  <div id="card">
    <div class="name">Dominik Satory, Ph.D.</div>
    <div class="title">scientist | leader | tinkerer | biotechnology</div>
    <div class="contact">
      <a href="mailto:d@satory.us">d@satory.us</a>
      <span class="sep">|</span>
      <a href="https://linked.in/satory" target="_blank" rel="noopener">linked.in/satory</a>
      <span class="sep">|</span>
      Boston, MA
    </div>
  </div>
</body>
</html>
